# ==============================================================================
# Investiga - Alembic Migration Configuration
# ==============================================================================

[alembic]
# Path to migration scripts directory
script_location = app/db/migrations

# Template used to generate migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Prepend application root to sys.path so alembic can import app modules
prepend_sys_path = .

# Timezone for revision file timestamps (UTC recommended)
timezone = UTC

# Max length of characters for slug field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a .py counterpart to be detected as revisions
# sourceless = false

# Version table name in PostgreSQL
version_table = alembic_version

# Schema for version table (if using multi-schema architecture)
# version_table_schema = public

# Output encoding
output_encoding = utf-8

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
